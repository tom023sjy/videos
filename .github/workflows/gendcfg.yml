name: Auto genderate file changes

on:
  push:
    paths:
      - 'ts_files/*.ts'
      - 'ts_files/**/*.ts'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Gender config.json
        run: |
          python generate_config.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --staged --quiet || git commit -m "🤖 自动更新 config.json [skip ci]"
          git push
